<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./pokemon.js" defer></script>
    <script src="./search.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="main">
        <header class="header home">

            <div class="container">
                <div class="logo-wrapper">
                    <img src="./assets/pokeball.svg" alt="pokeball">
                    <h1>Pokedex</h1>
                </div>
                <div class="search-wrapper">
                    <div class="search-wrap">
                        <img src="./assets/search.svg" alt="search icon" class="search-icon">
                        <input type="text" placeholder="Search" id="search-input" class="search-input body3-fonts">
                        <img src="./assets/cross.svg" alt="cross icon" id="search-close-icon" class="search-close-icon">
                    </div>
                    <div class="sort-wrapper">
                        <div class="sort-wrap">
                            <img src="./assets/sorting.svg" alt="sorting" id="sort-icon" class="sort-icon">
                        </div>
                        <div class="filter-wrapper">
                            <p class="body2-fonts">Sort by:</p>
                            <div class="filter-wrap">
                                <div>
                                    <input type="radio" value="number" name="filters" id="number" checked>
                                    <label for="number" class="body3-fonts">Number</label>
                                </div>
                                <div>
                                    <input type="radio" value="name" name="filters" id="name">
                                    <label for="name" class="body3-fonts">Name</label>
                                </div>
                                <div>
                                    <input type="checkbox" value="favorites" name="filters" id="favorites">
                                    <label for="favorites" class="body3-fonts">Favorites</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </header>

        <section class="pokemon-list">
            <div class="container">
                <div class="list-wrapper">

                </div>
            </div>
            <div id="not-found-message"> Pokemon not found</div>
        </section>
    </main>

</body>

</html>
